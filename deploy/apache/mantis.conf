<VirtualHost *:80>
    ServerName mantis.local

    DocumentRoot /var/www/mantis

    ProxyPreserveHost On
    ProxyRequests Off

    # FastAPI backend. The frontend is built with VITE_API_URL=/api.
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    ProxyPass /api http://127.0.0.1:4000/api
    ProxyPassReverse /api http://127.0.0.1:4000/api

    # Optional backend endpoints that are useful for operations.
    ProxyPass /health http://127.0.0.1:4000/health
    ProxyPassReverse /health http://127.0.0.1:4000/health
    ProxyPass /docs http://127.0.0.1:4000/docs
    ProxyPassReverse /docs http://127.0.0.1:4000/docs
    ProxyPass /openapi.json http://127.0.0.1:4000/openapi.json
    ProxyPassReverse /openapi.json http://127.0.0.1:4000/openapi.json

    <Directory /var/www/mantis>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    <FilesMatch "\.(?:js|mjs|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/mantis-error.log
    CustomLog ${APACHE_LOG_DIR}/mantis-access.log combined
</VirtualHost>
